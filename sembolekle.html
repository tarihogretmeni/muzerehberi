<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Fotoğraf Yükleme</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter&display=swap">
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            margin: 10px;
            line-height: 1.5;
            color: #333;
        }

        .kriterler {
            background-color: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        .responsive-iframe {
            position: relative;
            width: 100%;
            padding-bottom: 75%;
            /* Tablet ve bilgisayar için oran */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .responsive-iframe iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        @media (max-width: 768px) {
            .responsive-iframe {
                padding-bottom: 160%;
                /* Mobil cihazlar için oran */
            }

            body {
                font-size: 15px;
                margin: 5px;
            }

            .kriterler {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

    <h3>Fotoğraf Yükleme Kriterleri</h3>
    <div class="kriterler">
        <ul>
            <li>Uygulamanın tanımadığı fotoğrafları buraya ekleyebilirsiniz. Eğer sembolün adını biliyorsanız "Adını
                Biliyorum", bilmiyorsanız "Adını Bilmiyorum" kategorisine fotoğraflarınızı ekleyiniz.</li>
            <li>Fotoğraf farklı açılardan çekilmiş ve net olmalı.</li>
        </ul>
    </div>

    <div class="responsive-iframe">
        <iframe src="https://padlet.com/muzedeqrkod/muzerehberi"></iframe>
    </div>

</body>

</html>
